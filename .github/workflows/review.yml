name: Review checks and manuscript build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-package:
    name: Retained package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q reproduce
      - name: Assemble bibliography and check citation coverage
        run: python reproduce/assemble_references.py
      - name: Check exact illustrative examples
        run: python reproduce/check_examples.py
      - name: Check retained PDF, evidence, and review records
        # This validates saved audit correspondence, not the release proofs.
        # Run before a fresh TeX build changes the retained PDF's bytes.
        run: python reproduce/package_review.py

  latex:
    name: Rebuild manuscript (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern
      - name: Assemble bibliography
        run: python reproduce/assemble_references.py
      - name: Build PDF and check references and layout overflow
        run: python reproduce/build.py
      - name: Upload TeX logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latex-build-logs
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/*.txt
            build/*.log
      - name: Upload rebuilt PDF and build record
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-review
          if-no-files-found: error
          retention-days: 14
          path: |
            openai-mathematical-frontiers.pdf
            audit/build.json
